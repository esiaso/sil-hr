name: silhr

# One command from a clean checkout:   docker compose up --build
#   web   http://localhost:3320          (Next.js; proxies /api/v1 to the API)
#   api   http://localhost:3310/api/v1   (OpenAPI UI at /api/v1/docs)
#   mail  http://localhost:8026          (Mailpit: every email the system sends)
# Tests:                                 docker compose --profile test run --build --rm test
# Host ports avoid sil_procurement's (3000/8080/5432) so both can run side by side.

x-api-env: &api-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3000
  DATABASE_URL: postgres://${POSTGRES_USER:-silhr}:${POSTGRES_PASSWORD:-silhr_dev_password}@postgres:5432/${POSTGRES_DB:-silhr}
  REDIS_URL: redis://redis:6379/0
  JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:-c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3c3}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3320}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3310}
  DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
  SEED_ON_START: ${SEED_ON_START:-true}
  SEED_SAMPLE: ${SEED_SAMPLE:-true}
  SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-Hospital#Dev2026}
  SAMPLE_WEBHOOK_URL: ${SAMPLE_WEBHOOK_URL:-http://webhook-sink:8099/hooks}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9010}
  S3_BUCKET: ${S3_BUCKET:-silhr-documents}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-silhr}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-silhr_dev_minio_password}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  JOBS_MODE: ${JOBS_MODE:-queue}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-silhr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-silhr_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-silhr}
    ports:
      - "${POSTGRES_PORT:-55433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for documents. Console: http://localhost:9011
  # Bitnami's legacy MinIO build (as in sil_procurement); use a maintained S3 store in production.
  minio:
    image: bitnamilegacy/minio:2024.10.13
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-silhr}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-silhr_dev_minio_password}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-silhr-documents}
    ports:
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"

  api:
    build: { context: ., target: api }
    environment:
      <<: *api-env
    ports:
      - "${API_PORT:-3310}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      mailpit: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  # Publishes the outbox (webhooks + Redis Stream), delivers webhooks, sends mail.
  worker:
    build: { context: ., target: api }
    command: ["node", "dist/src/worker.js"]
    environment:
      <<: *api-env
      DB_MIGRATIONS_RUN: "false"
      SEED_ON_START: "false"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    environment:
      HR_API_INTERNAL_URL: http://api:3000
      PUBLIC_API_DOCS_URL: ${PUBLIC_BASE_URL:-http://localhost:3310}/api/v1/docs
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${WEB_PORT:-3320}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Development-only receiver for the sample webhook subscription: verifies every
  # signature and keeps the last 200 deliveries. Browse http://localhost:8099/hooks
  webhook-sink:
    build: { context: ., target: api }
    command: ["node", "dist/src/tools/webhook-sink.js"]
    environment:
      WEBHOOK_SINK_SECRET: whsec_c2lsLWhyLWRldmVsb3BtZW50LXdlYmhvb2stc2VjcmV0
      WEBHOOK_SINK_PORT: 8099
    ports:
      - "${WEBHOOK_SINK_PORT:-8099}:8099"
    restart: unless-stopped

  test:
    profiles: ["test"]
    build: { context: ., target: test }
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-silhr}:${POSTGRES_PASSWORD:-silhr_dev_password}@postgres:5432/silhr_test
      TEST_REDIS_URL: redis://redis:6379/1
      TEST_S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-silhr}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-silhr_dev_minio_password}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  miniodata:
